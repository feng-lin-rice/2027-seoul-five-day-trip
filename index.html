function market(){const filters=['全部','零食','食品','甜點'];let data=PRODUCTS.map((p,i)=>({...p,index:i})).filter(p=>state.filter==='全部'||p.group===state.filter);let done=PRODUCTS.filter((x,i)=>isdone('p'+i)).length;return `<div class="section-head"><h2>超市想買清單</h2><span class="counter">已買 ${done}/13</span></div><p style="font-size:12px;color:#788997;margin-top:-6px">看到喜歡才買，不用全部買。照片是包裝示意，不保證與現場品牌完全相同。</p><div class="filters">${filters.map(f=>`<button class="filter ${state.filter===f?'active':''}" onclick="state.filter='${f}';render()">${f}</button>`).join('')}</div><div class="products">${data.map(p=>`<div class="product ${isdone('p'+p.index)?'isdone':''}"><img src="${p.src}" alt="${clean(p.name)} 示意圖" loading="lazy"><div class="body"><h3>${clean(p.name)}</h3><div class="ko">${clean(p.ko)}</div><label class="done"><input type="checkbox" ${isdone('p'+p.index)?'checked':''} onchange="toggle('p${p.index}')"> 已經買到</label></div></div>`).join('')}</div><div class="clear-note">本清單已剔除你說不要的五樣：藥果、即食米飯、黑豆奶、一分鐘高湯圈、黃芥末醬。請以實際店內包裝為準。</div>`}
